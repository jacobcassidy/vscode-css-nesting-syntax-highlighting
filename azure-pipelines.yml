trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      npm install -g @vscode/vsce
    displayName: "Install vsce and dependencies"
    workingDirectory: "$(Build.SourcesDirectory)"

  - task: AzureCLI@3
    displayName: "Publish extension using managed identity"
    inputs:
      azureSubscription: "vscode_publishing_connection"
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: "$(Build.SourcesDirectory)"
      inlineScript: |
        set -euo pipefail
        az account show --query '{tenant:tenantId,user:user}' -o json
        az rest \
          --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
          --resource 499b84ac-1321-427f-aa17-267ca6975798 \
          --query '{id:id,displayName:displayName}' -o json
